[pytest]
# pytest configuration for DataLens testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 3.9

# Test paths
testpaths = .

# Output options
addopts =
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Strict config (fail on config errors)
    --strict-config
    # Shorter traceback format
    --tb=short

# Markers
markers =
    ui: Tests that involve UI interactions (clicks, keyboard, etc.)
    slow: Tests that take significant time to complete
    requires_app: Tests that require the full DataLens application loaded (all should have this)
    plugin_widget_test: Plugin widget group discovery and testing

# Logging
log_cli = false
log_cli_level = INFO
log_file = test_run.log
log_file_level = DEBUG

# Qt-specific options (pytest-qt)
qt_api = pyside6

# Coverage options (when using --cov)
[coverage:run]
source = ../src/datalens
omit =
    */tests/*
    */test_*.py

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = htmlcov
